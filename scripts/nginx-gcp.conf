## 8. Configuracion de Nginx<tool_call>
<function=write>
<parameter=content>upstream api_backend {
    server 127.0.0.1:8000;
}

upstream frontend {
    server 127.0.0.1:4321;
}

server {
    listen 80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # Redirigir HTTP a HTTPS (despues de certbot)
    # return 301 https://$host$request_uri;

    # Proxy al frontend Astro SSR
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy a la API FastAPI
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting
        limit_req zone=api burst=10 nodelay;
    }

    # Health check
    location /health {
        proxy_pass http://api_backend/api/v1/health;
        access_log off;
    }

    # Archivos estaticos del frontend (cache agresivo)
    location /_astro/ {
        proxy_pass http://frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
