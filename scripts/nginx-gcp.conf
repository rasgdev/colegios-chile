## 6. Configuracion de la aplicacion

### 6.1 Clonar el repo

```bash
cd /home/colegios
sudo mkdir -p /var/www/colegios-chile
sudo chown $USER:$USER /var/www/colegios-chile
cd /var/www/colegios-chile
git clone https://github.com/tu-usuario/colegios-chile.git .
```

### 6.2 Instalar dependencias del backend (produccion)

```bash
python3 -m venv .venv
source .venv/bin/activate
pip install -r requirements-prod.txt
```

### 6.3 Instalar dependencias del frontend y compilar

```bash
cd frontend
npm install
npm run build
cd ..
```

### 6.4 Configurar variables de entorno

```bash
cat > .env.production << 'EOF'
DATABASE_URL=postgresql+asyncpg://colegios:colegios@localhost:5432/colegios
API_PORT=8000
FRONTEND_PORT=4321
API_BASE_URL=https://apisae.mineduc.cl
COMUNAS_API_URL=https://api.baseapi.cl/api/v1/sii/datos/comunas
MAX_CONCURRENT_REQUESTS=5
REQUEST_DELAY_SECONDS=1.0
MAX_RETRIES=5
REQUEST_TIMEOUT=30
LOG_LEVEL=WARNING
EOF
```

### 6.5 Cargar la base de datos

```bash
source .venv/bin/activate
make init-db
make migrate
make load-db
```

