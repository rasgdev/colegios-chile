[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colegios-chile"
version = "0.1.0"
description = "Buscador de colegios de Chile con datos públicos del MINEDUC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ETL
    "httpx>=0.25.0",
    "polars>=0.19.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "duckdb>=0.9.0",
    "tenacity>=8.2.0",
    "structlog>=23.2.0",
    "tqdm>=4.66.0",
    # Backend / persistencia
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pandas>=2.2.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.28.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["src*", "etl*", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src", "config", "etl"]
