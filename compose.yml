services:
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: colegios-db
    environment:
      POSTGRES_USER: colegios
      POSTGRES_PASSWORD: colegios
      POSTGRES_DB: colegios
    ports:
      - "5432:5432"
    volumes:
      - colegios_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colegios -d colegios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  colegios_pgdata:
