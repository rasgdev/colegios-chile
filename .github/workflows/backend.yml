name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "etl/**"
      - "alembic/**"
      - "alembic.ini"
      - "config/**"
      - "tests/**"
      - "scripts/init_db.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "Makefile"
  pull_request:
    paths:
      - "src/**"
      - "etl/**"
      - "alembic/**"
      - "alembic.ini"
      - "config/**"
      - "tests/**"
      - "scripts/init_db.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "Makefile"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: colegios
          POSTGRES_PASSWORD: colegios
          POSTGRES_DB: colegios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colegios -d colegios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://colegios:colegios@localhost:5432/colegios

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy
        run: mypy src etl

      - name: Tests
        run: pytest