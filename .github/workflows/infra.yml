name: Infra GCP (manual)

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Solo plan (true) o apply (false)"
        required: false
        default: "false"
      recreate:
        description: "Recrear la VM (terraform taint). true/false"
        required: false
        default: "false"

concurrency:
  group: infra-gcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_project_id: ${{ secrets.TF_VAR_project_id }}
      TF_VAR_region: ${{ secrets.TF_VAR_region }}
      TF_VAR_zone: ${{ secrets.TF_VAR_zone }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_repo_url: ${{ secrets.TF_VAR_repo_url }}
      TF_VAR_repo_branch: ${{ secrets.TF_VAR_repo_branch }}
      TF_VAR_deploy_sa_email: ${{ secrets.TF_VAR_deploy_sa_email }}
      TF_VAR_tf_sa_email: ${{ secrets.TERRAFORM_SERVICE_ACCOUNT }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
      TF_VAR_ssh_source_ranges: "[]"

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Init
        run: terraform init -backend-config=bucket=colegios-chile-tfstate -backend-config=prefix=infra

      - name: Taint VM (recreate)
        if: github.event.inputs.recreate == 'true'
        run: terraform taint google_compute_instance.colegios_server || true

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        if: github.event.inputs.plan_only == 'false'
        run: terraform apply tfplan